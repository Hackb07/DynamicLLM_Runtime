[package]
name = "dynamic-llm-runtime"
version = "0.1.0"
edition = "2021"
description = "A Rust-based AI execution runtime designed to unify LLM inference backends and explore intelligent model routing, resource-aware scheduling, dynamic model lifecycle management, and agentic execution."
license = "MIT"
repository = ""
readme = "README.md"
keywords = ["llm", "runtime", "ai", "inference", "agentic"]
categories = ["asynchronous", "web-programming", "science"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", default-features = false, features = ["json", "query", "form", "http1", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
tower = { version = "0.4", features = ["timeout", "util"] }
tower-http = { version = "0.5", features = ["trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
dotenvy = "0.15"
# In-process GGUF inference engine (llama.cpp bindings). Build needs cmake
# and libclang; see target/tools/env.ps1 (portable, created by setup).
llama-cpp-2 = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "runtime_bench"
harness = false
