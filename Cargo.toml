[package]
name = "dynamic-llm-runtime"
version = "0.1.0"
edition = "2021"
description = "A Rust-based AI execution runtime designed to unify LLM inference backends and explore intelligent model routing, resource-aware scheduling, dynamic model lifecycle management, and agentic execution."
license = "MIT"
repository = ""
readme = "README.md"
keywords = ["llm", "runtime", "ai", "inference", "agentic"]
categories = ["asynchronous", "web-programming", "science"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
sysinfo = "0.31"
tower = { version = "0.4", features = ["timeout"] }
tower-http = { version = "0.5", features = ["trace"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[[bench]]
name = "runtime_bench"
harness = false
